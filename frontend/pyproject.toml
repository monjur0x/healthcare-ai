[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
lines_between_types = 1

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PIE", "BLE", "A",
]

[tool.ruff.lint.isort]
force-single-line = false
lines-between-types = 1