version: '3.8'

services:
  healthcare-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Healthcare AI Backend
      - DEBUG=false
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    volumes:
      - ./app:/app/app
    depends_on:
      - qdrant
    networks:
      - healthcare-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - healthcare-network
    restart: unless-stopped

volumes:
  qdrant-data:
    driver: local

networks:
  healthcare-network:
    driver: bridge
